version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart_placement_mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smart_placement
    depends_on:
      - mongodb
    restart: unless-stopped
